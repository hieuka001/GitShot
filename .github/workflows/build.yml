name: Build GitShot.exe (Windows)

# GITHUB_TOKEN mặc định ở repo mới chỉ có quyền đọc -> bước tạo Release bị 403.
# Cấp rõ quyền ghi nội dung để action-gh-release tạo được Release khi push tag.
permissions:
  contents: write

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit tests
        run: |
          pip install Pillow numpy imageio imageio-ffmpeg
          python -m unittest discover -s tests -v

  build:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install "pyinstaller>=6,<7"
      - name: Build GitShot.exe
        run: pyinstaller GitShot.spec --noconfirm
      - name: Smoke check — kiểm tra exe tồn tại và CHẠY THỬ (--selftest)
        shell: pwsh
        run: |
          if (!(Test-Path "dist/GitShot.exe")) { throw "GitShot.exe not found" }
          Get-Item dist/GitShot.exe | Select-Object Name, Length
          $p = Start-Process .\dist\GitShot.exe -ArgumentList "--selftest" -PassThru
          if (-not $p.WaitForExit(90000)) { $p.Kill(); throw "GitShot.exe --selftest không tự thoát sau 90s" }
          if ($p.ExitCode -ne 0) { throw "GitShot.exe --selftest thoát với mã $($p.ExitCode)" }
          Write-Host "Selftest OK"
      - uses: actions/upload-artifact@v4
        with:
          name: GitShot-Windows
          path: dist/GitShot.exe
      - name: Publish release (khi push tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/GitShot.exe
          body: |
            ## GitShot

            1. Tải **GitShot.exe**, chạy trực tiếp (không cần cài đặt).
            2. Mở **Cài đặt** → dán Personal Access Token của GitHub (hướng dẫn trong README).
            3. Chụp bằng phím tắt, sửa nếu cần, ấn **Enter** — liên kết GitHub tự sao chép.

            Cấu hình và token của bản cũ được giữ nguyên khi thay exe mới.
